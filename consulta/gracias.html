<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>¡Recibido! · Clavia</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20260823-2">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --cream: #f5f9f6; --panel: #ffffff; --ink: #101828; --muted: #667085;
      --line: rgba(16, 24, 40, .12); --lime: #3d9166;
      --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      --serif: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--cream); font-family: var(--sans); display: flex; flex-direction: column; }
    .nav { height: 72px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; }
    .brand { display: inline-flex; align-items: center; gap: 4px; font-family: var(--serif); font-size: 23px; color: var(--ink); text-decoration: none; }
    .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--lime); margin-bottom: 13px; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 56px 24px; text-align: center; }
    .card { max-width: 520px; }
    h1 { font-family: var(--serif); font-size: clamp(34px, 5vw, 48px); font-weight: 500; margin: 0 0 16px; }
    p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 8px; }
    #status { margin-top: 24px; font-size: 12px; color: var(--muted); }
    .cookie-banner{position:fixed;bottom:0;left:0;right:0;background:#101828;z-index:999;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:2px solid #6FC194;transform:translateY(0);transition:transform .4s}
    .cookie-banner.hidden{transform:translateY(110%)}
    .cookie-banner p{font-size:13px;color:rgba(255,255,255,.55);margin:0}
    .cookie-banner a{color:#6FC194}
    .cookie-btns{display:flex;gap:10px;flex-shrink:0}
    .cb-accept{background:#6FC194;color:#fff;border:none;padding:9px 20px;border-radius:5px;cursor:pointer;font-size:11px;letter-spacing:1px;font-family:var(--sans)}
    .cb-reject{background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.4);padding:9px 16px;border-radius:5px;cursor:pointer;font-size:11px;font-family:var(--sans)}
  </style>
  <!--
    Initialise the shared tracker before loading Google. It records the visitor's
    Consent Mode choice first, then configures GA4 and Google Ads.
  -->
  <script src="/assets/clavia-openai-pixel.js?v=20260907-1"></script>
  <script src="/assets/clavia-tracking.js"></script>
  <script>window.ClaviaTracking.init();</script>
</head>
<body>
  <nav class="nav"><a class="brand" href="/"><span>clavia</span><span class="dot"></span></a></nav>
  <main class="main">
    <div class="card">
      <h1>¡Recibido!</h1>
      <p>Hemos guardado tu consulta correctamente. Te responderemos por email o WhatsApp, normalmente el mismo día.</p>
      <p id="status"></p>
    </div>
  </main>

  <div class="cookie-banner" id="cookieBanner">
    <p>Usamos cookies técnicas y analíticas para mejorar tu experiencia. <a href="/cookies.html">Política de cookies</a></p>
    <div class="cookie-btns">
      <button class="cb-reject" onclick="rejectCookies()">Solo necesarias</button>
      <button class="cb-accept" onclick="acceptCookies()">Aceptar</button>
    </div>
  </div>
  <script>
  function acceptCookies(){
    localStorage.setItem('clavia_consent','accepted');
    document.getElementById('cookieBanner').classList.add('hidden');
    if(typeof gtag==='function') gtag('consent','update',{analytics_storage:'granted',ad_storage:'granted',ad_user_data:'granted',ad_personalization:'granted'});
    if(window.ClaviaOpenAIPixel) window.ClaviaOpenAIPixel.setConsent(true);
  }
  function rejectCookies(){
    localStorage.setItem('clavia_consent','rejected');
    document.getElementById('cookieBanner').classList.add('hidden');
    if(typeof gtag==='function') gtag('consent','update',{analytics_storage:'denied',ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied'});
    if(window.ClaviaOpenAIPixel) window.ClaviaOpenAIPixel.setConsent(false);
  }
  if(localStorage.getItem('clavia_consent')) document.getElementById('cookieBanner').classList.add('hidden');
  </script>

  <script>
    const CONFIRM_ENDPOINT = "https://clavia-leads-api.noisy-sea-21c2.workers.dev/api/leads/confirm";
    const CONVERSION_SEND_TO = "AW-17976955492/2yR3CIi4m-gcEOSkivxC";
    const statusEl = document.getElementById("status");

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const leadId = params.get("lead_id");
      const conversionToken = params.get("conversion_token");

      // Unlike the owner-approved Google page-load conversion above, OpenAI's lead
      // event needs a real successful submission: it is armed only by consulta's
      // 2xx Worker response and deduplicated with its server-generated lead ID.
      if (leadId && sessionStorage.getItem("clavia_openai_pending_lead") === leadId) {
        window.ClaviaOpenAIPixel.leadCreated(leadId);
      }

      // The requested conversion point is the displayed thank-you page itself.
      // Do not depend on URL parameters or a network round-trip: a completed
      // navigation here must always emit the Google Ads conversion event.
      gtag("event", "conversion", { send_to: CONVERSION_SEND_TO });
      statusEl.textContent = "Confirmado.";

      // Best-effort follow-up call: dedupe on the server side and, when possible,
      // attach Enhanced Conversions user data (hashed) to the same conversion via
      // gtag('set','user_data', ...) before any further hits on this page load.
      if (leadId && conversionToken) {
        try {
          const response = await fetch(CONFIRM_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lead_id: leadId, conversion_token: conversionToken })
          });
          const data = await response.json();
          const attribution = window.ClaviaTracking.attribution();
          if (data.user_data && attribution.ad_user_data_consent === "granted") {
            gtag("set", "user_data", data.user_data);
          }
        } catch (error) {
          // Silent by design: the conversion already fired above regardless.
        }
      }
    })();
  </script>
</body>
</html>
